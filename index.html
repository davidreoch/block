<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Block</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Block">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F4F0">
<style>
  :root{
    --bg:#F5F4F0; --ink:#161616; --mute:#6B6B66; --line:#D8D6CF;
    --blue:#1E4DB7; --blue-soft:#E4EBFA; --done:#1F6F43; --done-soft:#E1F0E6;
    --amber:#9A5B00; --amber-soft:#FBEBD0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums}
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}

  header{position:sticky;top:0;background:var(--bg);z-index:5;
    padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:8px}
  .weeks{display:flex;gap:6px;flex:1}
  .weeks button{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;
    font-weight:600;background:#fff}
  .weeks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .maxbtn{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--blue);font-weight:600;white-space:nowrap}
  .days{display:flex;gap:6px;margin-top:8px}
  .days button{flex:1;height:36px;border-radius:8px;font-weight:600;color:var(--mute)}
  .days button.on{background:var(--blue-soft);color:var(--blue)}
  .days button.full{color:var(--done)}

  main{padding:10px 14px 60px}
  .title{margin:6px 0 12px;font-size:14px;color:var(--mute)}

  .ex{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:10px}
  .ex.done{border-color:var(--done)}
  .ex .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ex .name{font-weight:700;font-size:17px}
  .ex .rx{font-size:14px;color:var(--mute)}
  .big{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
  .big .kg{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .big .unit{font-size:16px;color:var(--mute)}
  .big .rpe{margin-left:auto;font-size:15px;color:var(--mute)}
  .big .rpe b{color:var(--ink)}
  .guide{font-size:13px;color:var(--amber);background:var(--amber-soft);
    padding:4px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}

  .log{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
  .field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
    border-radius:8px;height:44px;padding:0 10px;background:#fff}
  .field span{font-size:13px;color:var(--mute);white-space:nowrap}
  .field input,.field select{flex:1;min-width:0;border:0;outline:0;height:100%;
    font-size:18px;font-weight:600;color:var(--blue);background:transparent}
  .field select{appearance:none;-webkit-appearance:none}
  .sets{display:flex;gap:6px;grid-column:1/-1}
  .sets button{flex:1;height:48px;border:1px solid var(--line);border-radius:8px;
    font-size:18px;font-weight:700;background:#fff;color:var(--mute)}
  .sets button.hit{background:var(--done-soft);color:var(--done);border-color:var(--done)}
  .sets button.short{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
  .note{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;height:40px;
    padding:0 10px;outline:0;font-size:15px}
  .hint{grid-column:1/-1;font-size:13px;color:var(--mute);margin-top:2px}
  .hint.warn{color:var(--amber)}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .panel h2{font-size:16px;margin:0 0 10px}
  .tm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tm label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
  .tm input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;
    padding:0 10px;font-size:20px;font-weight:700;color:var(--blue);outline:0}
  .rules{font-size:14px;color:var(--mute);margin:12px 0 0;padding-left:18px}
  .rules li{margin-bottom:6px}
  .primary{height:44px;padding:0 16px;border-radius:8px;background:var(--ink);color:#fff;font-weight:600}
  .ghost{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff}
  .reset{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;font-size:15px}
  .reset .new{font-weight:800;font-size:20px}
  .status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;
    opacity:0;transition:opacity .2s}
  .status.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="weeks" id="weeks"></div>
    <button class="maxbtn" id="maxbtn">Maxes</button>
  </div>
  <div class="days" id="days"></div>
</header>
<main id="main"></main>
<div class="status" id="status">Saved</div>

<script>
// ---------- programme definition ----------
const PCT = {
  squat:[76,78,80,82,84], psquat:[70,72,74,76,78],
  dead:[72,74,76,78,80],  pdead:[60,62,64,66,68],
  benchH:[78,80,82,84,86], benchM:[70,72,74,76,78],
  ct3:[68,70,72,74,76],   cgb:[68,70,72,74,76],
};
const MAIN_RPE=[6,6.5,7,7.5,8], VAR_RPE=[5,5.5,6,6.5,7];
const SINGLE_RPE=[7,7,7.5,7.5,8], SINGLE_PCT=[90,90,92,92,94];

// lift: which max; key: % table or 'single' or null (accessory)
const DAYS = {
  Mon:[
    {id:"m1",name:"Paused bench single",lift:"bench",key:"single",sets:1,reps:1},
    {id:"m2",name:"Paused bench",lift:"bench",key:"benchH",sets:5,reps:3,rpe:MAIN_RPE},
    {id:"m3",name:"Paused squat (0-1-0)",lift:"squat",key:"psquat",sets:3,reps:4,rpe:VAR_RPE},
    {id:"m4",name:"DB shoulder press",sets:3,reps:"6–8",cap:8},
    {id:"m5",name:"Pull-ups",sets:3,reps:"6–10",cap:8},
  ],
  Tue:[
    {id:"t1",name:"Deadlift single",lift:"dead",key:"single",sets:1,reps:1},
    {id:"t2",name:"Deadlift",lift:"dead",key:"dead",sets:4,reps:3,rpe:MAIN_RPE},
    {id:"t3",name:"3ct paused bench",lift:"bench",key:"ct3",sets:3,reps:3,rpe:VAR_RPE},
    {id:"t4",name:"Seated hamstring curl",sets:3,reps:"8–10",cap:7},
    {id:"t5",name:"Leg press",sets:3,reps:"8–10",cap:8},
  ],
  Thu:[
    {id:"h1",name:"Squat single",lift:"squat",key:"single",sets:1,reps:1},
    {id:"h2",name:"Squat",lift:"squat",key:"squat",sets:4,reps:4,rpe:MAIN_RPE},
    {id:"h3",name:"Paused bench",lift:"bench",key:"benchM",sets:4,reps:5,rpe:MAIN_RPE},
    {id:"h4",name:"Row",sets:3,reps:"6–8",cap:8},
    {id:"h5",name:"Incline DB curls",sets:3,reps:"8",cap:9},
  ],
  Fri:[
    {id:"f1",name:"Paused deadlift (0-1-0)",lift:"dead",key:"pdead",sets:3,reps:3,rpe:VAR_RPE},
    {id:"f2",name:"Close grip bench",lift:"bench",key:"cgb",sets:4,reps:6,rpe:MAIN_RPE},
    {id:"f3",name:"Tricep pushdowns",sets:3,reps:"10",cap:8},
    {id:"f4",name:"Lateral raises",sets:3,reps:"10",cap:8},
  ],
};
const WEEK6 = {
  Mon:[
    {id:"r1",name:"Squat single",lift:"squat",key:"test",sets:1,reps:1},
    {id:"r2",name:"Paused bench single",lift:"bench",key:"test",sets:1,reps:1},
    {id:"r3",name:"Back-off (both lifts)",sets:2,reps:"3",cap:"easy"},
  ],
  Thu:[
    {id:"r4",name:"Deadlift single",lift:"dead",key:"test",sets:1,reps:1},
    {id:"r5",name:"Light bench + accessories",sets:3,reps:"8",cap:"easy"},
  ],
};
const LIFTNAME={squat:"Squat",bench:"Paused bench",dead:"Deadlift"};
const RPE_OPTS=["",5,5.5,6,6.5,7,7.5,8,8.5,9,9.5,10];

// ---------- state ----------
let S = { tm:{squat:135,bench:110,dead:165}, week:1, day:"Mon", log:{}, showMax:false };
const KEY="block_tracker_v1";
let saveTimer=null;

function load(){
  try{ const r=localStorage.getItem(KEY); if(r){ const v=JSON.parse(r); S={...S,...v,showMax:false}; } }
  catch(e){ /* first run or storage unavailable */ }
  render();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify({tm:S.tm,week:S.week,day:S.day,log:S.log})); flash("Saved"); }
    catch(e){ flash("Not saved – open this page in Safari or Chrome"); }
  },400);
}
function flash(t){ const el=document.getElementById("status"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),900); }

const round=(x,inc=2.5)=>Math.round(x/inc)*inc;
function target(ex,w){
  if(!ex.lift) return null;
  const tm=S.tm[ex.lift];
  if(ex.key==="single") return round(tm*SINGLE_PCT[w-1]/100);
  if(ex.key==="test") return round(tm*0.94);
  return round(tm*PCT[ex.key][w-1]/100);
}
function logKey(ex,w){ return `w${w}_${ex.id}`; }
function getLog(ex,w){ return S.log[logKey(ex,w)] || (S.log[logKey(ex,w)]={kg:"",sets:[],rpe:"",note:""}); }

// ---------- render ----------
function render(){
  const weeks=document.getElementById("weeks"); weeks.innerHTML="";
  for(let w=1;w<=6;w++){
    const b=document.createElement("button"); b.textContent=w; b.className=S.week===w?"on":"";
    b.onclick=()=>{S.week=w; if(S.week===6&&!WEEK6[S.day]) S.day="Mon"; save(); render();};
    weeks.appendChild(b);
  }
  const daysEl=document.getElementById("days"); daysEl.innerHTML="";
  const plan=S.week===6?WEEK6:DAYS;
  for(const d of Object.keys(plan)){
    const b=document.createElement("button"); b.textContent=d;
    const complete=plan[d].every(ex=>isDone(ex,S.week));
    b.className=(S.day===d?"on ":"")+(complete?"full":"");
    b.onclick=()=>{S.day=d; save(); render();};
    daysEl.appendChild(b);
  }
  document.getElementById("maxbtn").onclick=()=>{S.showMax=!S.showMax; render();};

  const m=document.getElementById("main"); m.innerHTML="";
  if(S.showMax) m.appendChild(maxPanel());
  const title=document.createElement("div"); title.className="title";
  title.textContent = S.week===6 ? "Week 6 — reset. Singles at RPE 8 only, nothing else heavy."
    : `Week ${S.week} · ${S.day} · working sets should feel about RPE ${MAIN_RPE[S.week-1]}`;
  m.appendChild(title);
  for(const ex of plan[S.day]) m.appendChild(card(ex));
  if(S.week===6) m.appendChild(resetPanel());
}

function isDone(ex,w){
  const l=S.log[logKey(ex,w)]; if(!l) return false;
  return l.sets.filter(v=>v!=null&&v!=="").length>=ex.sets;
}

function card(ex){
  const w=S.week, l=getLog(ex,w), t=target(ex,w);
  const el=document.createElement("section"); el.className="ex"+(isDone(ex,w)?" done":"");
  const rx = ex.key==="single"||ex.key==="test" ? "1 × 1"
           : ex.lift ? `${ex.sets} × ${ex.reps} at ${ex.key==="test"?94:PCT[ex.key][w-1]}%`
           : `${ex.sets} × ${ex.reps}`;
  let rpeTxt="";
  if(ex.key==="single") rpeTxt=`cap <b>RPE ${SINGLE_RPE[w-1]}</b>`;
  else if(ex.key==="test") rpeTxt=`cap <b>RPE 8</b>`;
  else if(ex.rpe) rpeTxt=`expect <b>RPE ${ex.rpe[w-1]}</b>`;
  else rpeTxt=typeof ex.cap==="number"?`cap <b>RPE ${ex.cap}</b>`:`<b>${ex.cap}</b>`;

  el.innerHTML=`
    <div class="head"><div class="name">${ex.name}</div><div class="rx">${rx}</div></div>
    ${t!==null?`<div class="big"><div class="kg">${t}</div><div class="unit">kg</div><div class="rpe">${rpeTxt}</div></div>`
             :`<div class="big"><div class="rpe" style="margin-left:0">${rpeTxt}</div></div>`}
    ${ex.key==="single"||ex.key==="test"?`<div class="guide">Guide weight — the RPE cap decides</div>`:""}
    <div class="log">
      <label class="field"><span>kg</span><input type="number" inputmode="decimal" step="2.5" placeholder="${t??""}" value="${l.kg}"></label>
      <label class="field"><span>RPE</span><select>${RPE_OPTS.map(o=>`<option ${String(o)===String(l.rpe)?"selected":""}>${o}</option>`).join("")}</select></label>
      <div class="sets"></div>
      <input class="note" placeholder="Notes" value="${l.note.replace(/"/g,"&quot;")}">
      <div class="hint"></div>
    </div>`;

  const kg=el.querySelector('input[type=number]');
  kg.oninput=()=>{l.kg=kg.value; save();};
  const sel=el.querySelector("select");
  sel.onchange=()=>{l.rpe=sel.value; save(); hint();};
  const note=el.querySelector(".note");
  note.oninput=()=>{l.note=note.value; save();};

  const setsEl=el.querySelector(".sets");
  const rx_reps = typeof ex.reps==="number"?ex.reps:null;
  for(let i=0;i<ex.sets;i++){
    const b=document.createElement("button");
    const paint=()=>{
      const v=l.sets[i];
      if(v==null||v===""){ b.textContent="–"; b.className=""; }
      else { b.textContent=v; b.className=(rx_reps!==null&&v<rx_reps)?"short":"hit"; }
    };
    paint();
    // tap: first tap = prescribed reps; further taps count down; past 1 clears
    b.onclick=()=>{
      const v=l.sets[i];
      if(v==null||v===""){ l.sets[i]=rx_reps??1; }
      else if(v>1){ l.sets[i]=v-1; }
      else { l.sets[i]=""; }
      paint(); save(); el.classList.toggle("done",isDone(ex,w)); render_days_only();
    };
    setsEl.appendChild(b);
  }
  if(rx_reps===null && ex.sets>1){ // accessories: tap counts sets, so allow typing reps too
    setsEl.title="Tap to mark a set";
  }

  const hintEl=el.querySelector(".hint");
  function hint(){
    hintEl.className="hint"; hintEl.textContent="";
    const r=parseFloat(l.rpe); if(isNaN(r)) return;
    if(ex.key==="single"||ex.key==="test"){
      const cap=ex.key==="test"?8:SINGLE_RPE[w-1];
      if(r>cap){ hintEl.className="hint warn"; hintEl.textContent=`Over the cap by ${(r-cap).toFixed(1)}. Next week's single goes lighter, not heavier.`; }
      return;
    }
    if(ex.rpe){
      const exp=ex.rpe[w-1];
      if(w<=3 && r>=8){ hintEl.className="hint warn"; hintEl.textContent=`RPE 8+ in week ${w}: cut the ${LIFTNAME[ex.lift]} max 5% in Maxes.`; }
      else if(w===1 && r<=5){ hintEl.className="hint warn"; hintEl.textContent=`RPE 5 in week 1: raise the ${LIFTNAME[ex.lift]} max 5–7.5% from week 2.`; }
      else if(r>exp+1){ hintEl.className="hint warn"; hintEl.textContent=`A point harder than expected (${exp}). Watch it next session.`; }
    }
  }
  hint();
  return el;
}
function render_days_only(){ // cheap refresh of day-complete colouring
  const plan=S.week===6?WEEK6:DAYS;
  document.querySelectorAll("#days button").forEach((b,i)=>{
    const d=Object.keys(plan)[i]; b.classList.toggle("full",plan[d].every(ex=>isDone(ex,S.week)));
  });
}

function maxPanel(){
  const p=document.createElement("section"); p.className="panel";
  p.innerHTML=`<h2>Training maxes</h2>
    <div class="tm">
      ${["squat","bench","dead"].map(k=>`<div><label>${LIFTNAME[k]}</label><input type="number" inputmode="decimal" step="2.5" data-k="${k}" value="${S.tm[k]}"></div>`).join("")}
    </div>
    <ul class="rules">
      <li>A max you'd hit on a bad day. Every weight in the block comes from these three numbers.</li>
      <li>Working sets: weight is fixed. Log the RPE afterwards; don't change the weight mid-session.</li>
      <li>Weeks 1–3 at RPE 8+ → cut that max 5%. Week 1 at RPE 5 → raise it 5–7.5%.</li>
      <li>Singles: the RPE cap decides the weight. Stop at the cap even if it flew.</li>
      <li>Variants stay a full RPE point easier than the main lift.</li>
      <li>Accessories: add a rep each week; at the top of the range, add weight and drop back.</li>
      <li>Runs: hard Wed, easy Sat, long Sun. Never a hard run before deadlift day. Trim Monday's paused squat if needed, not Thursday's squat.</li>
    </ul>
    <div class="row" style="margin-top:12px;gap:8px">
      <button class="ghost" id="exp">Export backup</button>
      <button class="ghost" id="imp">Import backup</button>
      <input type="file" id="impfile" accept="application/json" style="display:none">
    </div>`;
  p.querySelector("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify({tm:S.tm,week:S.week,day:S.day,log:S.log},null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="block-backup.json"; a.click();
  };
  p.querySelector("#imp").onclick=()=>p.querySelector("#impfile").click();
  p.querySelector("#impfile").onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    f.text().then(t=>{ try{ const v=JSON.parse(t); S={...S,...v,showMax:false}; save(); render(); flash("Imported"); }catch(x){ flash("That file isn't a backup"); } });
  };
  p.querySelectorAll("input").forEach(i=>{ i.onchange=()=>{ const v=parseFloat(i.value); if(!isNaN(v)){S.tm[i.dataset.k]=v; save(); render();} }; });
  return p;
}

function resetPanel(){
  const p=document.createElement("section"); p.className="panel";
  const get=(id)=>{ const l=S.log[`w6_${id}`]; const v=l&&parseFloat(l.kg); return isNaN(v)?null:v; };
  const rows=[["squat","r1",5],["bench","r2",2.5],["dead","r4",5]];
  p.innerHTML=`<h2>New training maxes</h2>
    <div class="reset">
      ${rows.map(([k,id,add])=>{ const s=get(id); return `<div>${LIFTNAME[k]}</div><div>${s!==null?`${s} + ${add}`:"single not logged"}</div><div class="new">${s!==null?s+add:"–"}</div>`; }).join("")}
    </div>
    <div class="row" style="margin-top:12px;gap:8px">
      <button class="primary" id="apply">Apply new maxes</button>
      <button class="ghost" id="clear">Clear block log</button>
    </div>
    <p class="hint" style="margin:10px 0 0">Applying moves the maxes across and takes you back to week 1. Clearing wipes the logged sets so the next block starts clean; maxes are kept.</p>`;
  p.querySelector("#apply").onclick=()=>{
    let any=false;
    for(const [k,id,add] of rows){ const s=get(id); if(s!==null){ S.tm[k]=s+add; any=true; } }
    if(!any){ flash("Log the RPE 8 singles first"); return; }
    S.week=1; S.day="Mon"; save(); render(); flash("Maxes updated");
  };
  p.querySelector("#clear").onclick=()=>{ if(confirm("Clear every logged set for this block?")){ S.log={}; S.week=1; S.day="Mon"; save(); render(); } };
  return p;
}

load();
</script>
</body>
</html>
